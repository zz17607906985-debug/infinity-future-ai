# Installer packaging (electron-builder). App asar is still produced by scripts/build-release.js.
# NSIS uses solid 7z/LZMA for smaller setup size.
appId: com.infinityfutureai.canvas
productName: ∞未来 AI 无限画布
copyright: Copyright © Infinity Future AI
directories:
  output: dist-installer
  buildResources: build
files:
  - "**/*"
  - "!build-tools/**"
  - "!scripts/**"
  - "!docs/**"
  - "!node_modules/**"
extraResources:
  - from: ../resources/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
  - from: ../resources/legal
    to: legal
compression: maximum
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  solid: true
  # electron-builder packs the payload with 7-Zip solid LZMA when compression=maximum
  artifactName: "${productName}-Setup-${version}.${ext}"
  shortcutName: ∞未来 AI 无限画布
win:
  target:
    - target: nsis
      arch:
        - x64
